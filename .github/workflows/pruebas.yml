# Pruebas en cada push y PR (docs/plan-pruebas.md, Fase 4). No se conecta a producción ni usa
# secretos: la base de datos es un Supabase local que se crea y se destruye en la máquina de GitHub.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Sitio (Vitest, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # El mismo de netlify.toml (NODE_VERSION).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  base-de-datos:
    name: Base de datos (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      # Solo hacen falta Postgres y Auth (crea el esquema auth); los demás servicios se omiten
      # para que arranque más rápido. start aplica supabase/migrations y luego supabase/seed.sql.
      - name: Supabase local
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Pruebas pgTAP
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log
      # Las pruebas que fallan, como anotación del commit (se ven en el resumen sin abrir el log).
      - name: Resumen de fallas
        if: failure()
        run: |
          msg=$(grep -E 'not ok|^\s*#|Failed|Dubious|ERROR|error' pgtap.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=pgTAP::${msg:-sin detalle}"
